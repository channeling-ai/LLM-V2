name: Deploy to dev (k8s)

# develop 푸시 → 불변 태그(dev-<sha>)로 이미지 빌드/푸시 → INFRA values-dev.yaml 태그 갱신
# → ArgoCD 자동 배포. fastapi와 consumer 3종이 같은 chaneling-llm 이미지를 쓰므로 두 태그 모두 갱신.

on:
  push:
    branches: [ develop ]

concurrency:
  group: deploy-dev-llm
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 클러스터 노드가 arm64(OCI A1.Flex)라 arm64 이미지 필요. amd64 러너에서 QEMU 에뮬로 빌드.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/chaneling-llm:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # INFRA 레포의 fastapi + consumer image.tag 갱신 → ArgoCD가 배포
      - name: Bump image tag in INFRA
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch dev "https://x-access-token:${GH_TOKEN}@github.com/channeling-ai/INFRA.git" infra
          cd infra
          yq -i ".fastapi.image.tag = \"${TAG}\"" helm/chaneling/values-dev.yaml
          yq -i ".consumer.image.tag = \"${TAG}\"" helm/chaneling/values-dev.yaml
          git config user.name "channeling-ci"
          git config user.email "ci@channeling.ai"
          git add helm/chaneling/values-dev.yaml
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "[CI] LLM dev 이미지 태그 ${TAG}"
          for i in 1 2 3 4 5; do
            git push origin dev && exit 0
            echo "push 충돌, rebase 재시도 ($i)"; git pull --rebase origin dev
          done
          echo "push 실패"; exit 1
